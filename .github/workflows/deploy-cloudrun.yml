name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: protfolio-432618
      REGION: europe-west1
      SERVICE_NAME: cv-analyzer-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          gcloud builds submit \
            --suppress-logs \
            --tag europe-west1-docker.pkg.dev/$PROJECT_ID/cv-analyzer/cv-analyzer/backend \
            ./backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image europe-west1-docker.pkg.dev/$PROJECT_ID/cv-analyzer/cv-analyzer/backend \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest
